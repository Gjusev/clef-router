[project]
name = "clef-router"
version = "0.1.0"
description = "Route prompts between cheap and frontier LLMs using Cloudflare's Clef decision model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Youssef Ouhaghi Ahmian" }]
keywords = ["llm", "routing", "ai", "clef", "cloudflare", "decision-model", "cost-optimization"]
dependencies = ["httpx>=0.25"]

[project.scripts]
clef-route = "clef_router.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_router"]
