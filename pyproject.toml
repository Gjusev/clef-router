[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clef-router"
version = "0.3.0"
description = "OpenAI-compatible proxy that routes prompts between cheap and frontier LLMs using Cloudflare's Clef decision model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Youssef Ouhaghi Ahmian" }]
keywords = ["llm", "routing", "ai", "clef", "cloudflare", "decision-model", "cost-optimization", "openai-api", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/Gjusev/clef-router"
Issues = "https://github.com/Gjusev/clef-router/issues"

[project.optional-dependencies]
compactor = [
    "langchain-core>=0.1",
    "llama-index-core>=0.11",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
clef-route = "clef_router.cli:main"
clef-router = "clef_router.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_router"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/brag-output",
    "/docs/how-it-works.html",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that call the real Cloudflare Clef API (opt-in; need CLEF_ACCOUNT_ID/CLEF_API_TOKEN)",
]
# Skip @pytest.mark.integration tests by default; run them with `pytest -m integration`.
addopts = "-m 'not integration' --cov=clef_router --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["clef_router"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Canvas-drawing script: PIL coordinates and inline SVG/HTML strings do not
# wrap meaningfully at 88 columns.
"scripts/generate_assets.py" = ["E501"]
